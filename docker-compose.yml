services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: nms
      POSTGRES_USER: nms
      POSTGRES_PASSWORD: nms_secret_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  api:
    build: ./app/api
    ports:
      - "8080:8080"
    depends_on: [db, redis]
    environment:
      DATABASE_URL: postgres://nms:nms_secret_change_me@db:5432/nms?sslmode=disable
      REDIS_URL: redis://redis:6379
  poller:
    build: ./app/poller
    depends_on: [db, redis, api]
    environment:
      DATABASE_URL: postgres://nms:nms_secret_change_me@db:5432/nms?sslmode=disable
      REDIS_URL: redis://redis:6379
  frontend:
    build: ./app/frontend
    ports:
      - "3000:80"
    depends_on: [api]
volumes:
  pgdata:
